<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SORTER</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1 class="title">SORTER</h1>
  </header>

  <div class="container">
    <div class="nav-buttons">
      <button onclick="showOrganizer()" class="btn">Organizer View</button>
      <button onclick="showInvitee()" class="btn">Invitee View</button>
    </div>

    <div id="organizerSection" class="section">
      <h2 class="section-title">Organizer Setup</h2>
      <form id="pollForm" class="form">
        <div class="form-group">
          <label for="organizerName">Organizer Name:</label>
          <input type="text" id="organizerName" name="organizerName" required />
        </div>
        <div class="form-group">
          <label for="eventTitle">Event Title:</label>
          <input type="text" id="eventTitle" name="eventTitle" required />
        </div>
        <div class="form-group">
          <label for="dates">Enter Possible Dates (one per line):</label>
          <textarea id="dates" name="dates" rows="5" cols="40" placeholder="June 10, 2025
June 12, 2025
June 15, 2025" required></textarea>
        </div>
        <button type="submit" class="btn submit-btn">Create Poll</button>
      </form>
      <div id="result" class="result"></div>
      <button id="downloadBtn" class="btn download-btn" disabled>Download CSV</button>
    </div>

    <div id="inviteeSection" class="section" style="display: none;">
      <h2 class="section-title">Invite RSVP Form</h2>
      <form id="inviteForm" class="form"></form>
      <div id="inviteeResult" class="result"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
