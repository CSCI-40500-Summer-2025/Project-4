<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DatePoll Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>DatePoll Prototype</h1>

  <!-- Toggle Buttons -->
  <div>
    <button onclick="showOrganizer()">Organizer View</button>
    <button onclick="showInvitee()">Invitee View</button>
  </div>

  <!-- Organizer Section -->
  <div id="organizerSection">
    <h2>Organizer Setup</h2>
    <form id="pollForm">
      <label for="organizerName">Organizer Name:</label><br />
      <input type="text" id="organizerName" name="organizerName" required /><br /><br />

      <label for="eventTitle">Event Title:</label><br />
      <input type="text" id="eventTitle" name="eventTitle" required /><br /><br />

      <label for="dates">Enter Possible Dates (one per line):</label><br />
      <textarea
        id="dates"
        name="dates"
        rows="5"
        cols="40"
        placeholder="e.g., June 10\nJune 12\nJune 15"
        required
      ></textarea><br /><br />

      <button type="submit">Create Poll</button>
    </form>

    <div id="result" style="margin-top: 20px;"></div>
  </div>

  <!-- Invitee Section -->
  <div id="inviteeSection" style="display: none;">
    <h2>Invite RSVP Form</h2>
    <form id="inviteForm">
      <label for="name">Invitee Name:</label><br />
      <input type="text" id="name" required /><br /><br />

      <label for="rsvp">RSVP:</label><br />
      <select id="rsvp" required>
        <option value="">--Select--</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select><br /><br />

      <button type="submit">Submit RSVP</button>
    </form>

    <button id="downloadBtn">Download CSV</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
