<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DatePoll Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>DatePoll Prototype</h1>

  <div>
    <button onclick="showOrganizer()">Organizer View</button>
    <button onclick="showInvitee()">Invitee View</button>
  </div>

  <div id="organizerSection">
    <h2>Organizer Setup</h2>
    <form id="pollForm">
      <label for="organizerName">Organizer Name:</label><br />
      <input type="text" id="organizerName" name="organizerName" required /><br /><br />

      <label for="eventTitle">Event Title:</label><br />
      <input type="text" id="eventTitle" name="eventTitle" required /><br /><br />

      <label for="dates">Enter Possible Dates (one per line, e.g., MM/DD/YYYY):</label><br />
      <textarea
        id="dates"
        name="dates"
        rows="5"
        cols="40"
        placeholder="e.g., 06/10/2025\n06/12/2025\n06/15/2025"
        required
      ></textarea><br /><br />

      <button type="submit">Create Poll</button>
    </form>

    <div id="result" class="result-section"></div>
    <button id="downloadBtn" class="download-btn" disabled>Download CSV</button>
  </div>

  <div id="inviteeSection" style="display: none;">
    <h2>Invite RSVP Form</h2>
    <form id="inviteForm"></form>
    <div id="inviteeResult" class="result-section"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
